version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: live_poll_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=live_polling
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: live_poll_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: live_poll_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GIN_MODE=release
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=live_polling
      - REDIS_ADDR=redis:6379
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: live_poll_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
      - VITE_WS_BASE_URL=ws://localhost:8080
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
